{% extends 'base.html' %}

{% block title %}重置密码 - 校园互助服务平台{% endblock %}

{% block content %}
<div class="mx-auto" style="max-width:450px;">
    <div class="card">
        <h2 style="margin-bottom:16px;">重置密码</h2>
        <p style="color:#666;margin-bottom:16px;">请输入您的注册邮箱，我们将发送密码重置链接。</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_email">邮箱</label>
                <input type="email" name="email" id="id_email" class="form-control" required placeholder="请输入注册邮箱">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">发送重置链接</button>
        </form>
        <div style="margin-top:12px;text-align:center;">
            <a href="{% url 'accounts:login' %}">返回登录</a>
        </div>
    </div>
</div>
{% endblock %}
